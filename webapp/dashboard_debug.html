<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>📊 Dashboard Debug - PlantUSDT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17;
            color: #ccd6f0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: #00ff87; margin-bottom: 20px; }
        .section {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .section h2 {
            font-size: 16px;
            color: #8247E5;
            margin-bottom: 8px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 14px;
        }
        .row:last-child { border-bottom: none; }
        .label { color: #8892b0; }
        .value { color: #00ff87; font-weight: 600; }
        .error-text { color: #ff6b6b; padding: 10px; }
        .loading-text { color: #8892b0; padding: 20px; text-align: center; }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            color: #ccd6f0;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        .json-view {
            background: rgba(0,0,0,0.4);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
            color: #a29bfe;
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <a href="javascript:void(0)" class="back-btn" onclick="goBack()">← Back</a>
        <h1>📊 Dashboard Debug</h1>
        <p style="color:#8892b0;margin-bottom:16px;">This page shows raw data from the API for debugging.</p>

        <div id="loadingMessage" class="loading-text">Loading data...</div>

        <div id="debugContent" style="display:none;">
            <div class="section">
                <h2>👤 User Info</h2>
                <div id="userInfo"></div>
            </div>

            <div class="section">
                <h2>📊 User Stats</h2>
                <div id="userStats"></div>
            </div>

            <div class="section">
                <h2>💎 Referral Stats</h2>
                <div id="referralStats"></div>
            </div>

            <div class="section">
                <h2>🌱 Fields</h2>
                <div id="fieldsInfo"></div>
            </div>

            <div class="section">
                <h2>📋 Raw API Response (User)</h2>
                <div class="json-view" id="rawUserData"></div>
            </div>

            <div class="section">
                <h2>📋 Raw API Response (Referral Stats)</h2>
                <div class="json-view" id="rawReferralData"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://plantusdt.ddns.net';

        document.addEventListener('DOMContentLoaded', function() {
            var tg = window.Telegram.WebApp;
            try {
                tg.ready();
                tg.expand();
            } catch (e) {
                console.log('WebApp initialization error');
            }

            var user = tg.initDataUnsafe?.user;
            var userId = user?.id || '0';
            console.log('📱 User ID:', userId);

            loadDebugData(userId);
        });

        async function loadDebugData(userId) {
            try {
                const userResponse = await fetch(`${API_BASE}/api/user?telegram_id=${userId}`);
                const userData = await userResponse.json();
                console.log('📡 User data:', userData);

                const statsResponse = await fetch(`${API_BASE}/api/referral_stats_full/${userId}`);
                const statsData = await statsResponse.json();
                console.log('📡 Stats data:', statsData);

                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('debugContent').style.display = 'block';

                var userInfo = document.getElementById('userInfo');
                if (userData.success) {
                    userInfo.innerHTML = `
                        <div class="row"><span class="label">User ID</span><span class="value">${userId}</span></div>
                        <div class="row"><span class="label">Username</span><span class="value">${userData.username || 'N/A'}</span></div>
                        <div class="row"><span class="label">Balance</span><span class="value">$${Number(userData.balance || 0).toFixed(3)}</span></div>
                        <div class="row"><span class="label">Total Invested</span><span class="value">$${Number(userData.total_invested || 0).toFixed(3)}</span></div>
                        <div class="row"><span class="label">Total Deposited</span><span class="value">$${Number(userData.total_deposited || 0).toFixed(3)}</span></div>
                        <div class="row"><span class="label">Total Earnings</span><span class="value">$${Number(userData.total_earnings || 0).toFixed(3)}</span></div>
                        <div class="row"><span class="label">Investment Earnings</span><span class="value">$${Number(userData.investment_earnings || 0).toFixed(3)}</span></div>
                        <div class="row"><span class="label">Referral Earnings</span><span class="value">$${Number(userData.referral_earned || 0).toFixed(3)}</span></div>
                        <div class="row"><span class="label">Ad Earnings</span><span class="value">$${Number(userData.total_ad_earnings || 0).toFixed(3)}</span></div>
                        <div class="row"><span class="label">Tasks Earnings</span><span class="value">$${Number(userData.tasks_earnings || 0).toFixed(3)}</span></div>
                        <div class="row"><span class="label">Referral Tier</span><span class="value">${userData.referral_tier || 'free'}</span></div>
                        <div class="row"><span class="label">Welcome Bonus Claimed</span><span class="value">${userData.has_received_welcome_bonus ? '✅ Yes' : '❌ No'}</span></div>
                        <div class="row"><span class="label">Interstitial Ads Disabled</span><span class="value">${userData.interstitial_ads_disabled ? '✅ Yes' : '❌ No'}</span></div>
                        <div class="row"><span class="label">Referrals Count</span><span class="value">${userData.referrals || 0}</span></div>
                    `;
                } else {
                    userInfo.innerHTML = `<p class="error-text">❌ Error loading user data: ${userData.message || 'Unknown error'}</p>`;
                }

                var referralStats = document.getElementById('referralStats');
                if (statsData.success && statsData.stats) {
                    var stats = statsData.stats;
                    referralStats.innerHTML = `
                        <div class="row"><span class="label">Current Tier</span><span class="value">${stats.current_tier || 'free'} ${stats.tier_emoji || ''}</span></div>
                        <div class="row"><span class="label">Tier Bonus</span><span class="value">${stats.tier_bonus || 0}%</span></div>
                        <div class="row"><span class="label">Total Referrals</span><span class="value">${stats.total_referred || 0}</span></div>
                        <div class="row"><span class="label">Active Referrals</span><span class="value">${stats.active_referrals || 0}</span></div>
                        <div class="row"><span class="label">Active Bonus Earned</span><span class="value">$${Number(stats.active_bonus_earned || 0).toFixed(3)}</span></div>
                        <div class="row"><span class="label">Pending Active Referrals</span><span class="value">${stats.pending_active || 0}</span></div>
                        <div class="row"><span class="label">Upgrade Spent</span><span class="value">$${Number(stats.upgrade_spent || 0).toFixed(3)}</span></div>
                        <div class="row"><span class="label">Next Tier</span><span class="value">${stats.next_tier ? stats.next_tier.toUpperCase() : 'Max tier reached'}</span></div>
                        ${stats.next_tier ? `<div class="row"><span class="label">Next Tier Price</span><span class="value">$${Number(stats.next_tier_price || 0).toFixed(2)}</span></div>` : ''}
                        ${stats.next_tier_bonus ? `<div class="row"><span class="label">Next Tier Bonus</span><span class="value">${stats.next_tier_bonus}%</span></div>` : ''}
                    `;
                } else {
                    referralStats.innerHTML = `<p class="error-text">❌ Error loading referral stats</p>`;
                }

                var fieldsInfo = document.getElementById('fieldsInfo');
                if (userData.success && userData.fields) {
                    if (userData.fields.length === 0) {
                        fieldsInfo.innerHTML = `<p style="color:#8892b0;">No active fields. Plant your first field!</p>`;
                    } else {
                        var fieldsHtml = '';
                        userData.fields.forEach(function(field) {
                            fieldsHtml += `
                                <div style="background:rgba(0,0,0,0.2);padding:10px;border-radius:8px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.03);">
                                    <div><strong style="color:#00ff87;">Field #${field.field_number}</strong></div>
                                    <div style="font-size:13px;color:#8892b0;">Amount: $${field.amount.toFixed(3)}</div>
                                    <div style="font-size:13px;color:#8892b0;">Expected Return: $${field.expected_return.toFixed(3)}</div>
                                    <div style="font-size:13px;color:#8892b0;">Lock Period: ${field.lock_period || 30} days</div>
                                    <div style="font-size:13px;color:#8892b0;">Status: ${field.is_locked ? '🔒 Locked' : '🟢 Available'}</div>
                                    ${field.unlock_date ? `<div style="font-size:13px;color:#8892b0;">Unlock Date: ${new Date(field.unlock_date).toLocaleString()}</div>` : ''}
                                </div>
                            `;
                        });
                        fieldsInfo.innerHTML = fieldsHtml;
                    }
                } else {
                    fieldsInfo.innerHTML = `<p class="error-text">❌ No fields data</p>`;
                }

                document.getElementById('rawUserData').textContent = JSON.stringify(userData, null, 2);
                document.getElementById('rawReferralData').textContent = JSON.stringify(statsData, null, 2);

            } catch (error) {
                console.error('❌ Error loading debug data');
                document.getElementById('loadingMessage').textContent = '❌ Error loading data. Please try again.';
                document.getElementById('loadingMessage').className = 'error-text';
            }
        }

        function goBack() {
            window.history.back();
        }

        window.goBack = goBack;
        window.loadDebugData = loadDebugData;
    </script>
</body>
</html>
