<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>📊 Dashboard - PlantUSDT</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js" crossorigin="anonymous"></script>
    <style>
        .stat-value { font-size: 20px; }
        .loading-text { color: #8892b0; font-size: 14px; text-align: center; padding: 20px; }
        .error-text { color: #ff6b6b; font-size: 14px; text-align: center; padding: 20px; }
        .network-badge-mini { display: inline-block; background: rgba(130,71,229,0.2); color: #8247E5; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; flex-shrink: 0; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .dashboard-grid .stat-card { padding: 14px 8px; }
        .dashboard-grid .stat-value { font-size: 16px; }
        .dashboard-grid .stat-label { font-size: 9px; }
        .ad-stat-highlight { border: 1px solid rgba(0,212,255,0.3) !important; background: rgba(0,212,255,0.05) !important; }
        .ad-stat-highlight .stat-value { color: #00d4ff !important; }
        .task-stat-highlight { border: 1px solid rgba(0,255,135,0.3) !important; background: rgba(0,255,135,0.05) !important; }
        .task-stat-highlight .stat-value { color: #00ff87 !important; }
        .withdrawn-stat-highlight { border: 1px solid rgba(255,107,107,0.3) !important; background: rgba(255,107,107,0.05) !important; }
        .withdrawn-stat-highlight .stat-value { color: #ff6b6b !important; }
        .tier-display { background: rgba(130,71,229,0.1); border: 1px solid rgba(130,71,229,0.2); border-radius: 12px; padding: 12px 16px; margin: 12px 0; display: flex; justify-content: space-between; align-items: center; }
        .tier-display .tier-info { display: flex; align-items: center; gap: 8px; }
        .tier-display .tier-info .emoji { font-size: 24px; }
        .tier-display .tier-info .name { font-weight: 700; font-size: 16px; color: #ccd6f0; }
        .tier-display .tier-info .bonus { font-size: 14px; color: #00ff87; }
        .tier-display .upgrade-btn { background: linear-gradient(135deg, #00ff87, #8247E5); border: none; border-radius: 8px; padding: 8px 16px; color: #0a0e17; font-weight: 700; font-size: 13px; cursor: pointer; }
        .tier-display .upgrade-btn:hover { transform: scale(1.05); }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            padding-bottom: 40px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17;
            color: #ccd6f0;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }
        .action-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 14px 12px;
            color: #ccd6f0;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 100%;
        }
        .action-btn .btn-icon { font-size: 20px; }
        .action-btn:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .action-btn.primary {
            background: linear-gradient(135deg, rgba(0,255,135,0.15), rgba(130,71,229,0.15));
            border-color: rgba(0,255,135,0.2);
        }
        .back-btn {
            font-size: 28px !important;
            padding: 8px 16px !important;
            cursor: pointer !important;
            background: rgba(255,255,255,0.05) !important;
            border: 1px solid rgba(255,255,255,0.08) !important;
            border-radius: 8px !important;
            color: #ccd6f0 !important;
            line-height: 1 !important;
            min-width: 44px !important;
            min-height: 44px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 0 20px; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 20px; gap: 12px;">
            <button class="back-btn" onclick="goBack()">←</button>
            <h1 style="color:#00ff87;font-size:20px; margin: 0; flex: 1; text-align: center;">📊 Dashboard</h1>
            <span class="network-badge-mini">🟣 Polygon</span>
        </div>

        <div id="loadingMessage" class="loading-text">Loading your data...</div>

        <div id="dashboardStats" style="display:none;">
            <div class="stats-grid dashboard-grid">
                <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-label">Balance</div><div class="stat-value" id="dashBalance">$0.000</div></div>
                <div class="stat-card"><div class="stat-icon">🌱</div><div class="stat-label">Invested</div><div class="stat-value" id="dashInvested">$0.000</div></div>
                <div class="stat-card"><div class="stat-icon">📈</div><div class="stat-label">Earned</div><div class="stat-value" id="dashEarned">$0.000</div></div>
                <div class="stat-card"><div class="stat-icon">💳</div><div class="stat-label">Deposited</div><div class="stat-value" id="dashDeposited">$0.000</div></div>
                <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-label">Referrals</div><div class="stat-value" id="dashReferrals">0</div></div>
                <div class="stat-card ad-stat-highlight"><div class="stat-icon">📺</div><div class="stat-label">From Ads</div><div class="stat-value" id="dashAdEarnings">$0.000</div></div>
                <div class="stat-card task-stat-highlight"><div class="stat-icon">✅</div><div class="stat-label">From Tasks</div><div class="stat-value" id="dashTasksEarnings">$0.000</div></div>
                <div class="stat-card withdrawn-stat-highlight"><div class="stat-icon">📤</div><div class="stat-label">Withdrawn</div><div class="stat-value" id="dashWithdrawn">$0.000</div></div>
            </div>
            
            <div class="tier-display" id="tierDisplay">
                <div class="tier-info">
                    <span class="emoji" id="tierEmoji">🌱</span>
                    <div>
                        <div class="name" id="tierName">Free</div>
                        <div class="bonus" id="tierBonus">1% referral bonus</div>
                    </div>
                </div>
                <button class="upgrade-btn" onclick="window.location.href='index.html#upgrade'">⬆️ Upgrade</button>
            </div>
            
            <div style="text-align:center;color:rgba(255,255,255,0.4);font-size:12px;margin:8px 0 16px 0;">⛓️ All values in USDT on Polygon network</div>
            <div class="actions-grid" style="grid-template-columns:repeat(1,1fr);">
                <button class="action-btn" onclick="window.location.href='history.html'" style="background:linear-gradient(135deg,#a29bfe,#6c5ce7)!important;color:#fff!important;border:none;padding:16px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;">
                    <span class="btn-icon">📜</span> Transaction History
                </button>
            </div>
        </div>
    </div>

    <script>
        let isLoadingDashboard = false;

        document.addEventListener('DOMContentLoaded', function() {
            var tg = window.Telegram.WebApp;
            try {
                tg.ready();
                tg.expand();
            } catch (e) {
                console.log('WebApp initialization error');
            }

            var user = tg.initDataUnsafe?.user;
            var userId = user?.id || '0';
            console.log('User ID:', userId);

            document.getElementById('loadingMessage').textContent = 'Fetching data...';

            loadDashboard(userId);
        });

        function goBack() {
            window.location.href = 'index.html';
        }

        async function loadDashboard(userId, retries = 3) {
            if (isLoadingDashboard) return;
            isLoadingDashboard = true;

            try {
                const userResponse = await fetch(window.API_BASE + '/api/user?telegram_id=' + userId);
                const userData = await userResponse.json();
                console.log('User data:', userData);
                
                const statsResponse = await fetch(window.API_BASE + '/api/referral_stats_full/' + userId);
                const statsData = await statsResponse.json();
                console.log('Stats data:', statsData);

                const withdrawnResponse = await fetch(window.API_BASE + '/api/total_withdrawn/' + userId);
                const withdrawnData = await withdrawnResponse.json();
                console.log('Withdrawn data:', withdrawnData);
                
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('dashboardStats').style.display = 'block';
                
                if (userData.success) {
                    document.getElementById('dashBalance').textContent = '$' + Number(userData.balance || 0).toFixed(3);
                    document.getElementById('dashInvested').textContent = '$' + Number(userData.total_invested || 0).toFixed(3);
                    document.getElementById('dashEarned').textContent = '$' + Number(userData.total_earnings || 0).toFixed(3);
                    document.getElementById('dashDeposited').textContent = '$' + Number(userData.total_deposited || 0).toFixed(3);
                    document.getElementById('dashReferrals').textContent = userData.referrals || 0;
                    document.getElementById('dashAdEarnings').textContent = '$' + Number(userData.total_ad_earnings || 0).toFixed(3);
                    document.getElementById('dashTasksEarnings').textContent = '$' + Number(userData.tasks_earnings || 0).toFixed(3);
                }
                
                if (withdrawnData.success) {
                    document.getElementById('dashWithdrawn').textContent = '$' + Number(withdrawnData.total_withdrawn || 0).toFixed(3);
                }
                
                if (statsData.success && statsData.stats) {
                    const stats = statsData.stats;
                    document.getElementById('tierEmoji').textContent = stats.tier_emoji || '🌱';
                    document.getElementById('tierName').textContent = stats.current_tier ? stats.current_tier.toUpperCase() : 'Free';
                    document.getElementById('tierBonus').textContent = stats.tier_bonus + '% referral bonus';
                }
            } catch (error) {
                console.error('Error loading dashboard:', error);
                if (retries > 0) {
                    console.log('Retrying dashboard load... (' + retries + ' attempts left)');
                    setTimeout(function() {
                        loadDashboard(userId, retries - 1);
                    }, 1000);
                } else {
                    document.getElementById('loadingMessage').textContent = 'Network error. Please try again.';
                    document.getElementById('loadingMessage').className = 'error-text';
                }
            } finally {
                isLoadingDashboard = false;
            }
        }

        window.goBack = goBack;
        window.loadDashboard = loadDashboard;
    </script>
    <script src="js/app.js?v=50"></script>
</body>
</html>
